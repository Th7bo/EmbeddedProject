<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" width="780" height="470" font-family="Helvetica, Arial, sans-serif" font-size="12">
  <title>Meeple schematic: ESP-01 + PN532 (I2C) + LED, powered by USB to ESP-01 adapter. Matches diagrams/meeple/diagram.json and src/meeple/pins.h</title>
  <rect width="780" height="470" fill="#fff"/>

  <text x="20" y="28" font-size="16" font-weight="bold" fill="#222">Meeple: ESP-01 + PN532 V3 (I2C: SW1 ON, SW2 OFF) + LED</text>

  <g fill="none" stroke-width="2" stroke-linejoin="round">
    <!-- rails -->
    <line x1="290" y1="60" x2="720" y2="60" stroke="#d33"/>
    <line x1="200" y1="420" x2="720" y2="420" stroke="#222"/>

    <!-- power: USB adapter 3V3 / GND -->
    <polyline points="230,210 290,210 290,60" stroke="#d33"/>
    <polyline points="200,280 200,420" stroke="#222"/>

    <!-- ESP-01 left side: VCC, CH_PD + RST straight to 3V3, GND -->
    <polyline points="360,60 360,200 380,200" stroke="#d33"/>
    <polyline points="340,60 340,240 380,240" stroke="#d33"/>
    <polyline points="320,60 320,280 380,280" stroke="#d33"/>
    <polyline points="380,320 370,320 370,420" stroke="#222"/>

    <!-- I2C: GPIO2 = SCL, GPIO0 = SDA (internal pull-ups only) -->
    <polyline points="500,200 640,200" stroke="#36c"/>
    <polyline points="500,240 640,240" stroke="#2a2"/>

    <!-- PN532 power -->
    <polyline points="670,60 670,170" stroke="#d33"/>
    <polyline points="710,270 710,420" stroke="#222"/>

    <!-- LED on RX (GPIO3): RX -> 1k -> anode, cathode -> GND -->
    <polyline points="500,300 525,300" stroke="#e80"/>
    <polyline points="575,300 600,300" stroke="#e80"/>
    <polyline points="630,300 650,300 650,420" stroke="#222"/>

    <!-- TX to USB-serial -->
    <polyline points="500,325 520,325 520,380 250,380 250,250 230,250" stroke="#888"/>
  </g>


  <!-- LED resistor (horizontal) -->
  <line x1="525" y1="300" x2="535" y2="300" stroke="#222" stroke-width="2"/>
  <rect x="535" y="294" width="30" height="12" fill="#fff" stroke="#222" stroke-width="2"/>
  <line x1="565" y1="300" x2="575" y2="300" stroke="#222" stroke-width="2"/>
  <text x="550" y="290" font-size="10" fill="#444" text-anchor="middle">1k</text>

  <!-- LED symbol, anode left -->
  <polygon points="600,290 600,310 620,300" fill="#4af" stroke="#222" stroke-width="2"/>
  <line x1="620" y1="289" x2="620" y2="311" stroke="#222" stroke-width="2"/>
  <line x1="620" y1="300" x2="630" y2="300" stroke="#222" stroke-width="2"/>
  <g stroke="#4af" stroke-width="1.5"><line x1="610" y1="286" x2="618" y2="276"/><line x1="618" y1="286" x2="626" y2="276"/></g>
  <text x="640" y="283" font-size="10" fill="#444">LED</text>

  <!-- USB to ESP-01 adapter (ESP-01 not in its socket) -->
  <rect x="80" y="180" width="150" height="100" rx="4" fill="#f4f4f4" stroke="#222" stroke-width="2"/>
  <text x="140" y="203" text-anchor="middle" font-weight="bold">USB to ESP-01</text>
  <text x="140" y="217" text-anchor="middle" font-size="10">adapter (OPEN-SMART)</text>
  <text x="140" y="231" text-anchor="middle" font-size="9" fill="#666">power + monitor only</text>
  <g font-size="9" font-family="monospace" fill="#333">
    <text x="224" y="214" text-anchor="end" dy="-0">3V3</text>
    <text x="224" y="254" text-anchor="end">TX</text>
    <text x="200" y="274" text-anchor="middle">GND</text>
  </g>
  <rect x="60" y="215" width="20" height="30" fill="#bbb" stroke="#222" stroke-width="1.5"/>
  <text x="70" y="262" font-size="9" text-anchor="middle" fill="#444">USB</text>

  <!-- ESP-01 -->
  <rect x="380" y="180" width="120" height="160" rx="4" fill="#223" stroke="#222" stroke-width="2"/>
  <text x="440" y="265" text-anchor="middle" font-weight="bold" fill="#fff">ESP-01</text>
  <g font-size="10" font-family="monospace" fill="#fff">
    <text x="386" y="204">VCC</text><text x="386" y="244">CH_PD</text><text x="386" y="284">RST</text><text x="386" y="324">GND</text>
    <text x="494" y="204" text-anchor="end">GPIO2</text><text x="494" y="244" text-anchor="end">GPIO0</text>
    <text x="494" y="304" text-anchor="end">RX/GPIO3</text><text x="494" y="329" text-anchor="end">TX</text>
  </g>

  <!-- PN532 -->
  <rect x="640" y="170" width="100" height="100" rx="4" fill="#a22" stroke="#222" stroke-width="2"/>
  <text x="712" y="222" text-anchor="middle" font-weight="bold" fill="#fff">PN532</text>
  <text x="712" y="234" text-anchor="middle" font-size="10" fill="#fff">V3</text>
  <g font-size="10" font-family="monospace" fill="#fff">
    <text x="646" y="204">SCL/TXD</text><text x="646" y="244">SDA/RXD</text>
    <text x="670" y="184" text-anchor="middle">VCC</text><text x="710" y="264" text-anchor="middle">GND</text>
  </g>

  <!-- junctions -->
  <g fill="#222">
    <circle cx="320" cy="60" r="3.5"/><circle cx="340" cy="60" r="3.5"/><circle cx="360" cy="60" r="3.5"/>
    <circle cx="670" cy="60" r="3.5"/>
    
    <circle cx="370" cy="420" r="3.5"/><circle cx="650" cy="420" r="3.5"/>
  </g>

  <!-- labels -->
  <text x="725" y="64" fill="#d33" font-weight="bold">3V3</text>
  <text x="725" y="424" fill="#222" font-weight="bold">GND</text>
  <text x="258" y="374" font-size="10" fill="#666">serial monitor</text>
  <text x="510" y="194" font-size="10" fill="#36c">SCL</text>
  <text x="510" y="234" font-size="10" fill="#2a2">SDA</text>
  <text x="20" y="448" font-size="10" fill="#666">ESP-01 sits on the breadboard, not in the adapter. Adapter RX stays open: GPIO3 drives the LED.</text>
  <text x="20" y="462" font-size="10" fill="#666">To flash: put the ESP-01 in the adapter, slide the switch to PROG, replug USB, upload. Back to UART + breadboard to run.</text>
</svg>

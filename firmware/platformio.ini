; Snakes & Ladders: Hot or Cold — one PlatformIO project, one env per device.
; Code for each device lives in src/<env>/, code shared by both in include/.

[platformio]
default_envs = base, meeple

[env]
framework = arduino
monitor_speed = 115200

; Control base — ESP32 (LCD 16x2 I2C, push button, passive buzzer, LED)
[env:base]
platform = espressif32
board = esp32dev
build_src_filter = +<base/>
lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.2.0
    marcoschwartz/LiquidCrystal_I2C@^1.1.4

; Meeple — ESP-01 (ESP8266, 1 MB) + PN532 over I2C + LED, powered by a USB to ESP-01 adapter
[env:meeple]
platform = espressif8266
board = esp01_1m
upload_speed = 115200
build_src_filter = +<meeple/>
lib_deps =
    knolleary/PubSubClient@^2.8
    adafruit/Adafruit PN532@^1.3.3

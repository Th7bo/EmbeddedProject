; Snakes & Ladders: Hot or Cold — one PlatformIO project, one env per device.
; Code for each device lives in src/<env>/, code shared by both in include/.

[platformio]
default_envs = base, meeple

[env]
framework = arduino
monitor_speed = 115200

; Control base — ESP32 (128x64 graphic LCD via SparkFun serial backpack on UART2, push button, passive buzzer, LED)
[env:base]
platform = espressif32
board = esp32dev
build_src_filter = +<base/>
lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.2.0

; Meeple — ESP-01 (ESP8266, 1 MB) + PN532 over I2C + LED, powered by a USB to ESP-01 adapter
[env:meeple]
platform = espressif8266
board = esp01_1m
upload_speed = 115200
build_src_filter = +<meeple/>
lib_deps =
    knolleary/PubSubClient@^2.8
    adafruit/Adafruit PN532@^1.3.3

; Same meeple firmware for ESP-01 modules whose flash chip only boots in DOUT mode
; (e.g. Zbit, manufacturer id 0x5e: they flash fine with `meeple` but never start).
[env:meeple_dout]
extends = env:meeple
board_build.flash_mode = dout
